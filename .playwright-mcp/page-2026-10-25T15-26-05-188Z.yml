  - main [ref=e8]:
    - region [ref=e9]:
      - generic [ref=e11]:
        - generic [ref=e12]:
          - paragraph [ref=e13]: Medición y trazabilidad para generación de leads
          - heading "Conecta tus campañas con las oportunidades y ventas de tu CRM." [level=1] [ref=e14]
          - paragraph [ref=e15]: Identifica qué campañas generan negocio y utiliza señales de resultados comerciales para orientar tu inversión publicitaria. Revisamos la medición, corregimos brechas y conectamos la captación con lo que ocurre después del formulario.
          - paragraph [ref=e16]: Para empresas que captan leads con publicidad y utilizan un CRM.
        - link "Solicitar diagnóstico inicial" [ref=e18] [cursor=pointer]:
          - /url: "#diagnostico"
        - generic [ref=e19]:
          - paragraph [ref=e20]: Cuéntanos qué necesitas resolver. Revisaremos tu solicitud y te contactaremos si hay encaje para una conversación.
          - paragraph [ref=e21]: José Cubillo · Digital Analytics & Tracking
    - region [ref=e22]:
      - generic [ref=e24]:
        - generic [ref=e25]:
          - heading "Tu medición puede terminar donde empieza la venta." [level=2] [ref=e26]
          - paragraph [ref=e27]: "Un formulario enviado muestra que alguien se interesó. Para evaluar la inversión, necesitas saber qué ocurrió después: si ese contacto se convirtió en una oportunidad y si terminó comprando."
        - generic [ref=e28]:
          - generic [ref=e29]:
            - heading "Mides contactos, pero no resultados comerciales" [level=3] [ref=e30]
            - paragraph [ref=e31]: Sabes cuántos leads genera cada campaña, pero no cuáles avanzan a oportunidades o ventas. Comparar solo el costo por lead puede favorecer campañas que traen contactos baratos con poco valor comercial.
          - generic [ref=e32]:
            - heading "Los datos de publicidad, web y CRM no encajan" [level=3] [ref=e33]
            - paragraph [ref=e34]: Las plataformas reportan cifras distintas y cuesta explicar las diferencias. Sin revisar cómo se registra cada conversión, resulta difícil saber qué información utilizar para decidir.
          - generic [ref=e35]:
            - heading "Tus campañas reciben señales incompletas" [level=3] [ref=e36]
            - paragraph [ref=e37]: Si las plataformas solo reciben el envío del formulario, la optimización no incorpora qué contactos avanzan o compran. Conectar esos resultados puede aportar señales más útiles, cuando la integración sea viable.
        - paragraph [ref=e38]: Con esa conexión, puedes evaluar dónde reasignar presupuesto y qué campañas priorizar por su aporte comercial. El efecto depende también de las campañas, la oferta y el proceso de ventas.
    - region [ref=e39]:
      - generic [ref=e41]:
        - generic [ref=e42]:
          - heading "Una medición que conecta la captación con el resultado comercial." [level=2] [ref=e43]
          - paragraph [ref=e44]: Conectamos la información de tus campañas, tu sitio y tu CRM para seguir el recorrido del lead hasta la oportunidad y la venta. Según las brechas de tu operación, el proyecto puede incluir auditoría, implementación, corrección de datos y reporting.
        - figure "Esquema conceptual" [ref=e45]:
          - list "Campaña → Lead → CRM → Oportunidad → Venta" [ref=e47]:
            - listitem [ref=e48]:
              - generic [ref=e49]: Campaña
            - listitem [ref=e52]:
              - generic [ref=e53]: Lead
            - listitem [ref=e56]:
              - generic [ref=e57]: CRM
            - listitem [ref=e60]:
              - generic [ref=e61]: Oportunidad
            - listitem [ref=e64]:
              - generic [ref=e65]: Venta
          - paragraph [ref=e66]: Cuando la integración lo permite, los resultados comerciales también se envían a las plataformas publicitarias como señales de conversión.
        - list [ref=e67]:
          - listitem [ref=e68]:
            - heading "Auditoría de trazabilidad" [level=3] [ref=e69]
            - paragraph [ref=e70]: Identificamos dónde se pierde la conexión entre una campaña, el contacto que genera y su resultado en el CRM.
          - listitem [ref=e71]:
            - heading "Auditoría de calidad de datos" [level=3] [ref=e72]
            - paragraph [ref=e73]: Revisamos eventos y conversiones del sitio y las plataformas publicitarias para detectar registros duplicados, datos incompletos y diferencias que necesitan explicación.
          - listitem [ref=e74]:
            - heading "Implementación y corrección de medición" [level=3] [ref=e75]
            - paragraph [ref=e76]: Implementamos o corregimos eventos, conversiones e integraciones para recoger la información que necesita tu negocio.
          - listitem [ref=e77]:
            - heading "Reporting de marketing y ventas" [level=3] [ref=e78]
            - paragraph [ref=e79]: Organizamos los datos para comparar campañas por leads, oportunidades y ventas, con definiciones claras de cada indicador.
          - listitem [ref=e80]:
            - heading "Conexión entre campañas y CRM" [level=3] [ref=e81]
            - paragraph [ref=e82]: Vinculamos el origen de los leads con su avance comercial y evaluamos qué resultados pueden devolverse a las plataformas para optimizar.
        - generic [ref=e83]:
          - paragraph [ref=e84]: Según el alcance, trabajamos con GA4, Google Tag Manager, integraciones con CRM, BigQuery y mecanismos de conversión online y offline. La tecnología se define después de entender qué información falta y para qué se necesita.
          - paragraph [ref=e85]: Cada proyecto aborda las capacidades que requiere el problema detectado. El diagnóstico inicial orienta el alcance; la auditoría técnica detallada se acuerda por separado.
        - link "Solicitar diagnóstico inicial" [ref=e87] [cursor=pointer]:
          - /url: "#diagnostico"
    - region [ref=e88]:
      - generic [ref=e90]:
        - heading "Primero entendemos la brecha. Después definimos el trabajo." [level=2] [ref=e91]
        - list [ref=e92]:
          - listitem [ref=e93]:
            - generic [ref=e94]:
              - heading "Cuéntanos qué necesitas resolver" [level=3] [ref=e95]
              - paragraph [ref=e96]: Completa la solicitud con el contexto de tu empresa, tu captación de leads y el problema de medición que quieres abordar.
          - listitem [ref=e97]:
            - generic [ref=e98]:
              - heading "Revisamos tu solicitud" [level=3] [ref=e99]
              - paragraph [ref=e100]: Evaluamos el problema, los sistemas involucrados y el posible encaje del servicio con tu operación.
          - listitem [ref=e101]:
            - generic [ref=e102]:
              - heading "Conversamos sobre tu caso" [level=3] [ref=e103]
              - paragraph [ref=e104]: Si hay encaje, profundizamos en lo que necesitas medir, cómo funciona tu proceso comercial y qué requiere la conexión entre campañas y ventas.
          - listitem [ref=e105]:
            - generic [ref=e106]:
              - heading "Recibes una propuesta de alcance" [level=3] [ref=e107]
              - paragraph [ref=e108]: Definimos la intervención, los entregables, las responsabilidades y las condiciones del proyecto antes de comenzar.
        - generic [ref=e109]:
          - paragraph [ref=e110]: El diagnóstico inicial permite orientar el alcance. Una auditoría técnica detallada se acuerda por separado. Para enviar la solicitud no necesitas compartir accesos ni credenciales.
          - paragraph [ref=e111]: Los accesos y la participación de marketing, desarrollo o ventas se acuerdan según el proyecto.
    - region [ref=e112]:
      - generic [ref=e114]:
        - generic [ref=e115]:
          - heading "Soy José Cubillo, especialista en Digital Analytics y Tracking." [level=2] [ref=e116]
          - paragraph [ref=e117]: Soy especialista en Digital Analytics y Tracking, con experiencia en entornos B2B y generación de leads. Mi trabajo abarca planes de medición, implementación y revisión de eventos, análisis de funnels y trazabilidad entre la captación digital y el proceso comercial.
          - paragraph [ref=e118]: En esta consultora participo directamente en la evaluación, la definición del alcance y la ejecución técnica de cada proyecto.
        - list [ref=e119]:
          - listitem [ref=e120]: Medición de recorridos de generación de leads y sus puntos de conversión.
          - listitem [ref=e121]: Implementación y QA de tracking en sitios SPA y recorridos entre dominios.
          - listitem [ref=e122]: Trabajo con CRM y trazabilidad de leads entre sistemas digitales y comerciales.
        - link "Solicitar diagnóstico inicial" [ref=e124] [cursor=pointer]:
          - /url: "#diagnostico"
    - region [ref=e125]:
      - generic [ref=e127]:
        - heading "Medición que puedes verificar y mantener" [level=2] [ref=e128]
        - paragraph [ref=e129]: Cada implementación incluye validación técnica y documentación de lo realizado, para que tu equipo pueda entender qué se mide, cómo se registra y cómo mantenerlo.
        - paragraph [ref=e130]: La IA y la automatización apoyan tareas de análisis, documentación y control de calidad. Las decisiones de medición y la validación de los entregables permanecen bajo supervisión humana.
    - region [ref=e131]:
      - generic [ref=e133]:
        - heading "Antes de solicitar el diagnóstico" [level=2] [ref=e134]
        - generic [ref=e135]:
          - heading "¿Tiene sentido si mi agencia o equipo ya configura el tracking?" [level=3] [ref=e136]
          - paragraph [ref=e137]: Sí, cuando necesitas revisar la calidad de los datos o conectar la captación con lo que ocurre después del formulario. El trabajo puede complementar a tu equipo, con responsabilidades acordadas según el proyecto.
        - generic [ref=e138]:
          - heading "¿Cómo evaluamos si el proyecto justifica su costo?" [level=3] [ref=e139]
          - paragraph [ref=e140]: "Revisamos la brecha de medición, las decisiones que hoy dificulta y tu inversión publicitaria para orientar el alcance. No prometemos un ahorro: evaluamos qué información y señales puede aportar la intervención y cómo podrían utilizarse."
        - generic [ref=e141]:
          - heading "¿Cuánto tendrá que participar mi equipo?" [level=3] [ref=e142]
          - paragraph [ref=e143]: Depende de los sistemas y del alcance. Antes de comenzar, acordamos los accesos, los responsables y la participación necesaria de marketing, desarrollo y ventas.
